<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iPaper Support Tech Assessment</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- Start Screen -->
    <section id="screen-start" class="screen active">
      <div class="card centered">
        <div class="logo">iPaper</div>
        <h1>Support Tech Assessment</h1>
        <p class="subtitle">Three modules: JavaScript fundamentals, iFrame &amp; embedding, and the iPaper platform. Complete all three to see your results.</p>
        <div class="field">
          <label for="candidate-name">Your full name</label>
          <input type="text" id="candidate-name" placeholder="e.g. Jane Doe" autocomplete="name" />
          <span class="field-error" id="name-error"></span>
        </div>
        <button class="btn btn-primary" id="btn-start">Begin Assessment</button>
      </div>
    </section>

    <!-- Test Screen -->
    <section id="screen-test" class="screen">
      <header class="test-header">
        <div class="header-inner">
          <span class="header-logo">iPaper</span>
          <nav class="tab-bar" id="tab-bar">
            <!-- tabs injected by JS -->
          </nav>
          <span class="candidate-badge" id="header-name"></span>
        </div>
        <div class="progress-wrap">
          <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
          <span class="progress-label" id="progress-label"></span>
        </div>
      </header>

      <main class="test-main">
        <div class="section-badge" id="section-badge"></div>
        <div class="question-card" id="question-card">
          <h2 class="question-text" id="question-text"></h2>
          <!-- MCQ options -->
          <div class="options" id="options-container"></div>
          <!-- Code display block (for both MCQ with code and fix questions) -->
          <div class="code-display-wrap" id="code-display-wrap" style="display:none">
            <div class="code-display-header">
              <span id="code-display-lang"></span>
              <span class="code-label-broken" id="code-broken-label" style="display:none">⚠ Contains a bug</span>
            </div>
            <pre class="code-display"><code id="code-display"></code></pre>
          </div>
          <!-- Fix editor (fix-the-code questions) -->
          <div class="fix-editor-wrap" id="fix-editor-wrap" style="display:none">
            <label class="fix-label">✏ Edit the code below to fix the bug:</label>
            <div class="editor-shell">
              <div class="editor-gutter" id="editor-gutter"></div>
              <textarea class="code-editor" id="code-editor" spellcheck="false" autocorrect="off" autocapitalize="off"></textarea>
            </div>
            <button class="btn btn-check" id="btn-check-fix">Check Fix</button>
          </div>
        </div>

        <div class="test-nav">
          <div class="nav-hint" id="nav-hint"></div>
          <button class="btn btn-primary" id="btn-next" disabled>Next</button>
        </div>
      </main>
    </section>

    <!-- Results Screen -->
    <section id="screen-results" class="screen">
      <div class="card centered results-card">
        <div class="logo">iPaper</div>
        <h1>Assessment Complete</h1>
        <p class="results-name" id="results-name"></p>
        <div class="score-ring-wrap">
          <svg class="score-ring" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="52"/>
            <circle class="ring-fill" id="ring-fill" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          </svg>
          <div class="score-center">
            <span class="score-pct" id="score-pct">0%</span>
            <span class="score-sub" id="score-sub"></span>
          </div>
        </div>
        <div class="section-scores" id="section-scores"></div>
        <div class="verdict" id="verdict"></div>
        <button class="btn btn-outline" id="btn-restart">Start Over</button>
      </div>
    </section>

    <!-- Admin Screen -->
    <section id="screen-admin" class="screen">
      <header class="admin-header">
        <div class="header-inner">
          <span class="header-logo">iPaper</span>
          <span class="admin-title">Admin — Candidate Results</span>
          <button class="btn btn-danger-sm" id="btn-clear-all">Clear All Data</button>
        </div>
      </header>
      <main class="admin-main">
        <div id="admin-empty" class="admin-empty" style="display:none">
          <p>No assessments completed yet.</p>
        </div>
        <div id="admin-scoreboard"></div>
      </main>
    </section>

  </div>
  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
